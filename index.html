<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
    <link rel="apple-touch-icon" href="/assets/icon-192.png">
    <meta property="og:type" content="website">
    <meta property="og:title" content="カチログ - パチスロ小役カウンター">
    <meta property="og:description" content="パチスロの小役をタップでカウントして、確率計算と設定差の比較ができる無料アプリ。QR / URL でプリセットを共有。">
    <meta property="og:url" content="https://kachi-log.link/">
    <meta property="og:image" content="https://kachi-log.link/assets/icon-512.png">
    <meta name="twitter:card" content="summary">
    <title>カチログ - パチスロ小役カウンター</title>
    <meta name="description" content="カチログは、パチスロの小役をカウントして設定差を確認できるシンプルなカウンターアプリです。">
    <style>
        :root {
            --bg: #0D1117;
            --card: #161B22;
            --elevated: #21262D;
            --border: #30363D;
            --text: #F0F6FC;
            --text-sub: #8B949E;
            --accent: #3B82F6;
            --green: #22C55E;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 32px 24px;
            max-width: 420px;
            width: 100%;
            box-sizing: border-box;
        }
        .icon {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            display: block;
            margin: 0 auto 16px;
        }
        h1 {
            font-size: 26px;
            margin: 0 0 8px;
        }
        .lead {
            font-size: 15px;
            color: var(--text-sub);
            margin: 0 0 28px;
            line-height: 1.7;
        }
        .stores {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }
        .store-link {
            display: block;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            color: #fff;
            background: var(--accent);
        }
        .store-link.secondary {
            background: var(--elevated);
            border: 1px solid var(--border);
        }
        .store-link.disabled {
            background: var(--elevated);
            color: var(--text-sub);
            border: 1px solid var(--border);
            pointer-events: none;
        }
        .features {
            text-align: left;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 24px;
        }
        .features li {
            color: var(--text-sub);
            font-size: 14px;
            line-height: 1.8;
        }
        .footer {
            font-size: 12px;
            color: var(--text-sub);
        }
        .footer a {
            color: var(--text-sub);
            margin: 0 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="icon" src="/assets/icon-192.png" width="72" height="72" alt="カチログ">
        <h1>カチログ</h1>
        <p class="lead">パチスロの小役をカウントして<br>設定差をその場で確認できるカウンターアプリ</p>

        <div class="stores">
            <a class="store-link" href="https://play.google.com/store/apps/details?id=net.bayac.kachilog">Google Play で入手</a>
            <a class="store-link" href="https://apps.apple.com/jp/app/id6811277902">App Store で入手</a>
        </div>

        <ul class="features">
            <li>機種ごとにカウンターと設定差を自分で設定</li>
            <li>通常時 / AT中 など区間ごとに集計を切り替え</li>
            <li>プリセットを URL や QR コードで共有</li>
            <li>オフラインでも動作</li>
        </ul>

        <div class="stores">
            <a class="store-link secondary" href="/presets/">プリセットを探す</a>
        </div>

        <p class="footer">
            <a href="https://bayac.net/policy/">プライバシーポリシー</a>|
            <a href="https://bayac.net/term/">利用規約</a>
        </p>
    </div>
</body>
</html>
